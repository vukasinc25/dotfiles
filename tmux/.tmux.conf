# =========================================================
# TMUX CONFIG — Ubuntu Developer Workflow
# Prefix: Ctrl + Space
# =========================================================


# =========================================================
# CORE BEHAVIOR
# =========================================================

# Enable mouse:
# - click panes to focus
# - scroll through history
# - resize panes using borders
# - select text with mouse
set -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Replace default Ctrl+B prefix with Ctrl+Space.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Increase scrollback history per pane.
set -g history-limit 100000

# Start numbering windows and panes from 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

# Renumber window numbers automatically after closing one.
set -g renumber-windows on

# Faster command-response time. Useful for Vim/Neovim and key sequences.
set -sg escape-time 10

# Tell applications inside tmux that the terminal supports 256 colors.
set -g default-terminal "screen-256color"


# =========================================================
# WINDOWS AND PANES
# =========================================================

# Use | and - for intuitive pane splits.
# - | = vertical split (left/right panes)
# - - = horizontal split (top/bottom panes)
bind | split-window -h
bind - split-window -v

# Open new windows and splits in the same working directory
# as the current pane.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane movement:
# Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L.
# Repeat means you can hold the key to keep resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + Left/Right Arrow.
bind -n S-Left previous-window
bind -n S-Right next-window

# Reload config:
# Ctrl+Space, then r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# =========================================================
# COPY MODE AND CLIPBOARD
# =========================================================

# Use Vim motions in copy mode:
# h/j/k/l, / search, n next result, etc.
setw -g mode-keys vi

# Let tmux tell supporting terminal emulators about copied text.
set -g set-clipboard on

# Mouse wheel behavior:
# - scroll up enters copy mode if needed
# - Shift/Ctrl wheel supports faster scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Copy selected text to the normal desktop clipboard using xclip.
#
# Keyboard flow:
# Prefix + [       enter copy mode
# v                begin selection
# move with h/j/k/l or arrows
# Enter            copy selection to system clipboard
#
# Mouse flow:
# Click and drag text, then release. The selection is copied to clipboard.
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"


# =========================================================
# STATUS BAR
# =========================================================

# Status bar refresh interval in seconds.
set -g status-interval 5

# Keep the status bar visible and compact.
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Current session name on the left.
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#cdd6f4] "

# Window list in the middle.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W "

# Current time on the right.
set -g status-right-length 80
set -g status-right "#[fg=#a6adc8] %Y-%m-%d #[fg=#89b4fa,bold] %H:%M "

# Pane border colors.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"


# =========================================================
# PLUGINS — TPM
# =========================================================

# TPM: Tmux Plugin Manager.
# After cloning TPM, press Prefix + I (capital i) inside tmux
# to install all plugins declared below.
set -g @plugin 'tmux-plugins/tpm'

# Conservative quality-of-life defaults for tmux.
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save and restore tmux sessions, windows, panes, paths,
# layouts, and supported programs.
#
# Manual save:    Prefix + Ctrl+S
# Manual restore: Prefix + Ctrl+R
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically saves session state every 15 minutes and
# restores the latest saved tmux state when a tmux server starts.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Save visible pane contents too. Good for restoring context
# from logs or terminal output, but does not restart arbitrary processes.
set -g @resurrect-capture-pane-contents 'on'

# Clipboard helper. On Linux, it can use xclip.
# You already have xclip installed, so this complements the
# custom bindings above rather than replacing them.
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @override_copy_command 'xclip -in -selection clipboard'


# =========================================================
# TPM INITIALIZATION
# IMPORTANT: This line must stay at the bottom.
# =========================================================

run '~/.tmux/plugins/tpm/tpm'
